<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammora — Cinematic SaaS Showcase Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Inter+Tight:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="logo-data.js"></script>
  <style>
    :root {
      --primary: #6258E8;
      --primary-hover: #5147D4;
      --bg: #070A12;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: #F8FAFC;
      font-family: 'Inter', -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #stage-container {
      position: relative;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 50px rgba(98, 88, 232, 0.2);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #1E293B;
      background: #080C16;
    }
    canvas {
      display: block;
      width: 960px;
      height: 540px;
    }
    #controls {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: #111827;
      padding: 10px 20px;
      border-radius: 9999px;
      border: 1px solid #1F2937;
      font-size: 14px;
      font-family: 'JetBrains Mono', monospace;
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 6px 16px;
      border-radius: 9999px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: background 0.15s;
    }
    button:hover { background: var(--primary-hover); }
    #scrubber {
      width: 320px;
      cursor: pointer;
      accent-color: var(--primary);
    }
  </style>
</head>
<body>

  <div id="stage-container">
    <canvas id="canvas" width="1920" height="1080"></canvas>
  </div>

  <div id="controls">
    <button id="playBtn">Play</button>
    <input type="range" id="scrubber" min="0" max="1199" value="0" step="1">
    <span id="timecode">00:00.00 / 00:40.00</span>
    <span id="sceneBadge" style="color:#A5B4FC; font-weight:600;">Scene 1</span>
  </div>

  <audio id="soundtrack" src="../output/soundtrack.wav" preload="auto"></audio>

  <script>
    // --- Canvas & Rendering State ---
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const playBtn = document.getElementById('playBtn');
    const scrubber = document.getElementById('scrubber');
    const timecode = document.getElementById('timecode');
    const sceneBadge = document.getElementById('sceneBadge');
    const audio = document.getElementById('soundtrack');

    const TOTAL_FRAMES = 1200;
    const FPS = 30;
    const DURATION = 40.0;
    let currentFrame = 0;
    let isPlaying = false;
    let lastTimestamp = 0;
    let animId = null;

    // Dimensions
    const params = new URLSearchParams(window.location.search);
    const CANVAS_WIDTH = parseInt(params.get('w') || '1920', 10);
    const CANVAS_HEIGHT = parseInt(params.get('h') || '1080', 10);
    canvas.width = CANVAS_WIDTH;
    canvas.height = CANVAS_HEIGHT;

    // Display scale in browser vs render mode
    if (params.get('render') === '1') {
      canvas.style.width = CANVAS_WIDTH + 'px';
      canvas.style.height = CANVAS_HEIGHT + 'px';
      const ctrl = document.getElementById('controls');
      if (ctrl) ctrl.style.display = 'none';
      const stage = document.getElementById('stage-container');
      if (stage) {
        stage.style.border = 'none';
        stage.style.boxShadow = 'none';
        stage.style.borderRadius = '0';
      }
      document.body.style.margin = '0';
      document.body.style.padding = '0';
      document.body.style.overflow = 'hidden';
    } else if (CANVAS_WIDTH === 1080 && CANVAS_HEIGHT === 1350) {
      canvas.style.width = '432px';
      canvas.style.height = '540px';
    } else {
      canvas.style.width = '960px';
      canvas.style.height = '540px';
    }

    // Load Logo Image (Transparent PNG)
    const logoImg = new Image();
    let logoLoaded = false;
    logoImg.onload = () => { logoLoaded = true; renderFrame(currentFrame); };
    if (window.GRAMMORA_LOGO_B64) {
      logoImg.src = window.GRAMMORA_LOGO_B64;
    } else {
      logoImg.src = '../assets/grammora-logo-transparent.png';
    }

    // --- Math & Easing Helpers ---
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
    const easeInOutCubic = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const easeOutExpo = t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
    const easeOutBack = (t, s = 1.70158) => {
      const c1 = s;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    };

    // Rounded rectangle helper
    function roundRect(ctx, x, y, w, h, r) {
      if (w < 2 * r) r = w / 2;
      if (h < 2 * r) r = h / 2;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // Background Star / Grid Pattern
    function drawBackground(t) {
      const w = CANVAS_WIDTH;
      const h = CANVAS_HEIGHT;

      // Base gradient
      const bgGrad = ctx.createRadialGradient(w * 0.5, h * 0.45, 100, w * 0.5, h * 0.5, Math.max(w, h));
      bgGrad.addColorStop(0, '#111827');
      bgGrad.addColorStop(0.5, '#0B0F19');
      bgGrad.addColorStop(1, '#05070D');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      // Ambient glowing orbs
      const orb1X = w * 0.3 + Math.sin(t * 0.6) * 120;
      const orb1Y = h * 0.35 + Math.cos(t * 0.5) * 80;
      const grad1 = ctx.createRadialGradient(orb1X, orb1Y, 10, orb1X, orb1Y, 550);
      grad1.addColorStop(0, 'rgba(98, 88, 232, 0.28)');
      grad1.addColorStop(0.5, 'rgba(98, 88, 232, 0.08)');
      grad1.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad1;
      ctx.fillRect(0, 0, w, h);

      const orb2X = w * 0.75 + Math.cos(t * 0.4) * 100;
      const orb2Y = h * 0.65 + Math.sin(t * 0.7) * 90;
      const grad2 = ctx.createRadialGradient(orb2X, orb2Y, 10, orb2X, orb2Y, 600);
      grad2.addColorStop(0, 'rgba(56, 189, 248, 0.16)');
      grad2.addColorStop(0.5, 'rgba(99, 102, 241, 0.05)');
      grad2.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad2;
      ctx.fillRect(0, 0, w, h);

      // Tech Grid overlay
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      const gridSize = 64;
      for (let x = 0; x < w; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
      }
      for (let y = 0; y < h; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }
      ctx.restore();
    }

    // Realistic Mouse Cursor
    function drawCursor(x, y, clicking = false) {
      ctx.save();
      ctx.translate(x, y);

      if (clicking) {
        ctx.beginPath();
        ctx.arc(0, 0, 24, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(98, 88, 232, 0.7)';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.scale(0.88, 0.88);
      }

      ctx.shadowColor = 'rgba(0,0,0,0.45)';
      ctx.shadowBlur = 8;
      ctx.shadowOffsetY = 4;

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, 22);
      ctx.lineTo(5.5, 17.5);
      ctx.lineTo(11, 26);
      ctx.lineTo(14.5, 24);
      ctx.lineTo(9.5, 15.5);
      ctx.lineTo(17.5, 15.5);
      ctx.closePath();

      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = '#0F172A';
      ctx.stroke();

      ctx.restore();
    }

    // Perfectly-Padded Chrome/Editor Mockup Window (strictly safe for 16:9 & 4:5)
    function drawEditorWindow(x, y, w, h, activeTab = "New Message") {
      ctx.save();
      // Drop shadow
      ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
      ctx.shadowBlur = 40;
      ctx.shadowOffsetY = 24;

      // Card surface
      roundRect(ctx, x, y, w, h, 14);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      ctx.shadowColor = 'transparent';

      // Border
      ctx.strokeStyle = '#E2E8F0';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Clip content inside window
      ctx.beginPath();
      roundRect(ctx, x, y, w, h, 14);
      ctx.clip();

      // Title bar / browser chrome
      roundRect(ctx, x, y, w, 44, 14);
      ctx.fillStyle = '#F8FAFC';
      ctx.fill();
      ctx.fillRect(x, y + 25, w, 19);

      // Traffic light buttons
      const btnY = y + 22;
      const colors = ['#EF4444', '#F59E0B', '#10B981'];
      colors.forEach((col, idx) => {
        ctx.beginPath();
        ctx.arc(x + 22 + idx * 16, btnY, 5, 0, Math.PI * 2);
        ctx.fillStyle = col;
        ctx.fill();
      });

      // Browser Tab
      roundRect(ctx, x + 76, y + 8, 150, 36, 8);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      ctx.strokeStyle = '#E2E8F0';
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.font = '600 12px Inter, sans-serif';
      ctx.fillStyle = '#1E293B';
      ctx.fillText(activeTab, x + 92, y + 30);

      // Address pill
      const addrX = x + 238;
      const addrW = w - 262;
      roundRect(ctx, addrX, y + 10, addrW, 26, 6);
      ctx.fillStyle = '#EEF2F6';
      ctx.fill();

      // Lock icon + URL (Clean, contained)
      ctx.fillStyle = '#64748B';
      ctx.font = '12px "JetBrains Mono", monospace';
      ctx.fillText("🔒 mail.google.com/mail/u/0/#inbox", addrX + 14, y + 27);

      // Top action line
      ctx.beginPath();
      ctx.moveTo(x, y + 44);
      ctx.lineTo(x + w, y + 44);
      ctx.strokeStyle = '#E2E8F0';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Inner compose header: strictly padded inside
      ctx.font = '600 14px Inter, sans-serif';
      ctx.fillStyle = '#172033';
      ctx.fillText("To: sarah.miller@techcorp.io", x + 32, y + 80);

      ctx.fillStyle = '#64748B';
      ctx.font = '500 13px Inter, sans-serif';
      ctx.fillText("Subject: Project Collaboration & Roadmap", x + 32, y + 108);

      ctx.beginPath();
      ctx.moveTo(x + 32, y + 124);
      ctx.lineTo(x + w - 32, y + 124);
      ctx.strokeStyle = '#F1F5F9';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.restore();
    }

    // Grammora Floating Pen Pill (Real component representation)
    function drawFloatingPenPill(x, y, scale = 1.0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      ctx.shadowColor = 'rgba(98, 88, 232, 0.45)';
      ctx.shadowBlur = 16;
      ctx.shadowOffsetY = 6;

      roundRect(ctx, -18, -18, 36, 36, 10);
      ctx.fillStyle = '#6258E8';
      ctx.fill();
      ctx.shadowColor = 'transparent';

      // Pen nib icon
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 2.2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(-5, 6);
      ctx.lineTo(6, -5);
      ctx.moveTo(3, -8);
      ctx.lineTo(8, -3);
      ctx.moveTo(-7, 8);
      ctx.lineTo(-4, 8);
      ctx.stroke();

      ctx.restore();
    }

    // Grammora 5-Action Toolbar (Exact component representation)
    function drawToolbar(x, y, activeIndex = -1, scale = 1.0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      const items = [
        { label: "Fix Grammar", icon: "✨" },
        { label: "Rephrase", icon: "🔄" },
        { label: "Make Concise", icon: "✂️" },
        { label: "Change Tone", icon: "🎛️" },
        { label: "Insert", icon: "↵" }
      ];

      const w = 460;
      const h = 42;

      ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
      ctx.shadowBlur = 20;
      ctx.shadowOffsetY = 8;

      roundRect(ctx, 0, 0, w, h, 21);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      ctx.shadowColor = 'transparent';

      ctx.strokeStyle = '#E2E8F0';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      let curX = 12;
      items.forEach((item, idx) => {
        const itemW = 84;
        const isActive = (idx === activeIndex);

        if (isActive) {
          roundRect(ctx, curX, 5, itemW, 32, 16);
          ctx.fillStyle = '#6258E8';
          ctx.fill();
          ctx.fillStyle = '#FFFFFF';
        } else {
          ctx.fillStyle = '#475569';
        }

        ctx.font = '600 12px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(item.icon + " " + item.label.split(" ")[0], curX + itemW / 2, 25);
        curX += itemW + 4;
      });

      ctx.restore();
    }

    // Grammora Diff Preview Card with [← Back] and [Apply]
    function drawDiffCard(x, y, featureTag, originalText, fixedText, highlightWord = "", progress = 1.0) {
      ctx.save();
      ctx.translate(x, y);

      const w = 440;
      const h = 186;

      ctx.shadowColor = 'rgba(15, 23, 42, 0.25)';
      ctx.shadowBlur = 24;
      ctx.shadowOffsetY = 12;

      roundRect(ctx, 0, 0, w, h, 14);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      ctx.shadowColor = 'transparent';

      ctx.strokeStyle = '#E2E8F0';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Card Header
      ctx.textAlign = 'left';

      // [← Back] Button
      roundRect(ctx, 14, 12, 64, 26, 6);
      ctx.fillStyle = '#F1F5F9';
      ctx.fill();
      ctx.font = '600 11px Inter, sans-serif';
      ctx.fillStyle = '#475569';
      ctx.fillText("← Back", 24, 29);

      // Feature Badge
      roundRect(ctx, 86, 12, 110, 26, 6);
      ctx.fillStyle = '#F0EEFF';
      ctx.fill();
      ctx.fillStyle = '#6258E8';
      ctx.font = '700 11px Inter, sans-serif';
      ctx.fillText(featureTag, 96, 29);

      // Close Esc badge
      ctx.fillStyle = '#94A3B8';
      ctx.font = '500 11px "JetBrains Mono", monospace';
      ctx.fillText("Esc to dismiss", w - 105, 29);

      // Divider
      ctx.beginPath();
      ctx.moveTo(14, 46);
      ctx.lineTo(w - 14, 46);
      ctx.strokeStyle = '#F1F5F9';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Original text preview
      ctx.font = '500 13px Inter, sans-serif';
      ctx.fillStyle = '#94A3B8';
      ctx.fillText(originalText, 16, 72);

      // Fixed / Generated text card
      roundRect(ctx, 14, 86, w - 28, 48, 8);
      ctx.fillStyle = '#F8FAFC';
      ctx.fill();
      ctx.strokeStyle = '#E2E8F0';
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.font = '600 14px Inter, sans-serif';
      ctx.fillStyle = '#0F172A';

      if (highlightWord && fixedText.includes(highlightWord)) {
        const parts = fixedText.split(highlightWord);
        ctx.fillText(parts[0], 24, 116);
        const p0Width = ctx.measureText(parts[0]).width;

        const hwWidth = ctx.measureText(highlightWord).width;
        roundRect(ctx, 22 + p0Width, 98, hwWidth + 8, 24, 4);
        ctx.fillStyle = 'rgba(16, 185, 129, 0.15)';
        ctx.fill();

        ctx.fillStyle = '#10B981';
        ctx.fillText(highlightWord, 26 + p0Width, 116);

        ctx.fillStyle = '#0F172A';
        ctx.fillText(parts[1], 34 + p0Width + hwWidth, 116);
      } else {
        ctx.fillText(fixedText, 24, 116);
      }

      // Actions bottom bar
      roundRect(ctx, 14, 144, 76, 30, 6);
      ctx.fillStyle = '#F1F5F9';
      ctx.fill();
      ctx.fillStyle = '#64748B';
      ctx.font = '600 12px Inter, sans-serif';
      ctx.fillText("Discard", 28, 164);

      roundRect(ctx, w - 110, 144, 96, 30, 6);
      ctx.fillStyle = '#6258E8';
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '600 12px Inter, sans-serif';
      ctx.fillText("✓ Apply", w - 88, 164);

      ctx.restore();
    }

    // --- MAIN RENDER FUNCTION: window.renderFrame(frameIndex, totalFrames) ---
    window.renderFrame = function(frameIdx = 0, total = TOTAL_FRAMES) {
      currentFrame = clamp(frameIdx, 0, TOTAL_FRAMES - 1);
      const t = currentFrame / FPS; // Time in seconds 0.00 to 40.00

      // Update HUD
      scrubber.value = currentFrame;
      const mins = Math.floor(t / 60).toString().padStart(2, '0');
      const secs = (t % 60).toFixed(2).padStart(5, '0');
      timecode.textContent = `${mins}:${secs} / 00:40.00`;

      // Clear & Draw dynamic background
      drawBackground(t);

      // Determine active scene
      let sceneNum = 1;
      if (t < 3.0) sceneNum = 1;
      else if (t < 6.0) sceneNum = 2;
      else if (t < 11.0) sceneNum = 3;
      else if (t < 16.0) sceneNum = 4;
      else if (t < 21.0) sceneNum = 5;
      else if (t < 26.0) sceneNum = 6;
      else if (t < 31.0) sceneNum = 7;
      else if (t < 35.0) sceneNum = 8;
      else sceneNum = 9;

      sceneBadge.textContent = `Scene ${sceneNum}`;

      // Render Active Scene
      ctx.save();
      switch (sceneNum) {
        case 1: renderScene1(t); break;
        case 2: renderScene2(t); break;
        case 3: renderScene3(t); break;
        case 4: renderScene4(t); break;
        case 5: renderScene5(t); break;
        case 6: renderScene6(t); break;
        case 7: renderScene7(t); break;
        case 8: renderScene8(t); break;
        case 9: renderScene9(t); break;
      }
      ctx.restore();
    };

    // ==========================================
    // SCENE 1: The Hook (0.00s – 3.00s)
    // "Writing shouldn't slow you down."
    // Dynamically-spaced kinetic typography + Readable friction box
    // ==========================================
    function renderScene1(t) {
      const p = t / 3.0; // 0 to 1
      const cx = CANVAS_WIDTH / 2;
      const cy = CANVAS_HEIGHT / 2;

      // 1. Kinetic Typography: Dynamic measurement prevents ANY word overlap
      ctx.font = '800 58px "Inter Tight", Inter, sans-serif';
      const words = ["Writing", "shouldn't", "slow", "you", "down."];
      const spaceW = 22;
      const widths = words.map(w => ctx.measureText(w).width);
      const totalW = widths.reduce((a, b) => a + b, 0) + (words.length - 1) * spaceW;

      let curX = cx - totalW / 2;
      const lineY = cy - 80;

      words.forEach((word, idx) => {
        const wordDelay = idx * 0.12;
        const wp = clamp((t - wordDelay) / 0.4, 0, 1);
        const ease = easeOutBack(wp, 1.4);
        const yOffset = (1 - ease) * 35;
        const opacity = wp;

        ctx.save();
        // Highlight "slow you down." with soft violet
        const isHighlight = (idx >= 2);
        ctx.fillStyle = isHighlight ? `rgba(129, 140, 248, ${opacity})` : `rgba(248, 250, 252, ${opacity})`;
        ctx.shadowColor = isHighlight ? 'rgba(98, 88, 232, 0.6)' : 'transparent';
        ctx.shadowBlur = 20;

        ctx.textAlign = 'left';
        ctx.fillText(word, curX, lineY + yOffset);
        ctx.restore();

        curX += widths[idx] + spaceW;
      });

      // 2. Highlighting the search/compose box showing EXACTLY what "slow you down" means
      const boxW = 820;
      const boxH = 140;
      const boxX = cx - boxW / 2;
      const boxY = cy + 10;

      // Card shadow & surface
      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
      ctx.shadowBlur = 28;
      ctx.shadowOffsetY = 12;

      roundRect(ctx, boxX, boxY, boxW, boxH, 16);
      ctx.fillStyle = '#131B2E';
      ctx.fill();
      ctx.shadowColor = 'transparent';

      ctx.strokeStyle = 'rgba(98, 88, 232, 0.35)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Top label with friction warning badge
      ctx.font = '700 12px "JetBrains Mono", monospace';
      ctx.fillStyle = '#94A3B8';
      ctx.fillText("DRAFTING AN IMPORTANT EMAIL", boxX + 28, boxY + 34);

      // Warning status pill
      roundRect(ctx, boxX + boxW - 200, boxY + 18, 172, 24, 12);
      ctx.fillStyle = (t >= 1.4 && t < 2.5) ? 'rgba(239, 68, 68, 0.18)' : 'rgba(148, 163, 184, 0.12)';
      ctx.fill();
      ctx.fillStyle = (t >= 1.4 && t < 2.5) ? '#EF4444' : '#94A3B8';
      ctx.font = '600 11px Inter, sans-serif';
      ctx.fillText((t >= 1.4 && t < 2.5) ? "⚠️ WRITER'S FRICTION" : "⌨️ TYPING IN PROGRESS", boxX + boxW - 190, boxY + 34);

      // Readable, paced typing animation
      // "I am writing to askk"
      let text = "";
      let hasTypo = false;
      let typoCut = 0;

      if (t < 0.3) {
        text = "";
      } else if (t < 1.4) {
        // Slow, legible progressive typing
        const full = "I am writing to askk";
        const charProgress = clamp((t - 0.3) / 1.0, 0, 1);
        const charCount = Math.floor(charProgress * full.length);
        text = full.slice(0, charCount);
        if (text.endsWith("askk")) hasTypo = true;
      } else if (t < 1.9) {
        // Paused on typo: clearly visible to viewer!
        text = "I am writing to askk";
        hasTypo = true;
      } else if (t < 2.5) {
        // Backspacing letter by letter
        const backstep = Math.floor((t - 1.9) / 0.14); // 0, 1, 2, 3
        const base = "I am writing to askk";
        text = base.slice(0, Math.max(15, base.length - backstep));

        ctx.scale(logoP, logoP);

        ctx.shadowColor = 'rgba(98, 88, 232, 0.85)';
        ctx.shadowBlur = 60;

        const size = 210;
        ctx.drawImage(logoImg, -size / 2, -size / 2, size, size);
        ctx.restore();
      }

      // Title & Tagline
      const titleP = clamp((p - 0.2) / 0.45, 0, 1);
      const titleEase = easeOutCubic(titleP);

      ctx.save();
      ctx.textAlign = 'center';
      ctx.translate(cx, cy + 90 + (1 - titleEase) * 25);

      ctx.font = '900 76px "Inter Tight", Inter, sans-serif';
      ctx.fillStyle = `rgba(255, 255, 255, ${titleP})`;
      ctx.shadowColor = 'rgba(98, 88, 232, 0.6)';
      ctx.shadowBlur = 32;
      ctx.fillText("Grammora", 0, 0);

      // Tagline
      ctx.font = '600 26px Inter, sans-serif';
      ctx.fillStyle = `rgba(165, 180, 252, ${titleP})`;
      ctx.shadowColor = 'transparent';
      ctx.fillText("Write smarter. Express better.", 0, 46);

      // Call to action button
      const ctaP = clamp((p - 0.4) / 0.4, 0, 1);
      if (ctaP > 0) {
        const btnW = 320;
        const btnH = 56;
        const btnX = -btnW / 2;
        const btnY = 90;

        ctx.save();
        ctx.shadowColor = 'rgba(98, 88, 232, 0.5)';
        ctx.shadowBlur = 24;
        ctx.shadowOffsetY = 6;

        roundRect(ctx, btnX, btnY, btnW, btnH, 28);
        ctx.fillStyle = '#6258E8';
        ctx.fill();

        ctx.font = '700 18px Inter, sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText("Get Grammora on Chrome", 0, btnY + 35);
        ctx.restore();

        // GitHub repository link badge
        ctx.font = '500 14px "JetBrains Mono", monospace';
        ctx.fillStyle = 'rgba(148, 163, 184, 0.85)';
        ctx.fillText("Open Source on GitHub: github.com/beastwaleed/Grammora", 0, btnY + 95);
      }

      ctx.restore();

      // Smooth fade to black at the very end
      if (t >= 39.4) {
        const fadeP = (t - 39.4) / 0.6;
        ctx.fillStyle = `rgba(7, 10, 18, ${clamp(fadeP, 0, 1)})`;
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
      }
    }

    // --- Interactive Playback Engine ---
    function loop(timestamp) {
      if (!isPlaying) return;
      if (!lastTimestamp) lastTimestamp = timestamp;
      const delta = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      currentFrame += delta * FPS;
      if (currentFrame >= TOTAL_FRAMES) {
        currentFrame = TOTAL_FRAMES - 1;
        isPlaying = false;
        playBtn.textContent = 'Play';
        audio.pause();
        audio.currentTime = 0;
      }

      renderFrame(Math.floor(currentFrame));
      if (isPlaying) {
        animId = requestAnimationFrame(loop);
      }
    }

    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        if (currentFrame >= TOTAL_FRAMES - 1) currentFrame = 0;
        playBtn.textContent = 'Pause';
        lastTimestamp = performance.now();
        audio.currentTime = currentFrame / FPS;
        audio.play().catch(() => {});
        animId = requestAnimationFrame(loop);
      } else {
        playBtn.textContent = 'Play';
        audio.pause();
        if (animId) cancelAnimationFrame(animId);
      }
    });

    scrubber.addEventListener('input', (e) => {
      currentFrame = parseInt(e.target.value, 10);
      if (audio) audio.currentTime = currentFrame / FPS;
      renderFrame(currentFrame);
    });

    // Initial render
    renderFrame(0);
  </script>
</body>
</html>
