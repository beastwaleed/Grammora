<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammora — Cinematic SaaS Showcase Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Inter+Tight:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="logo-data.js"></script>
  <style>
    :root {
      --primary: #6258E8;
      --primary-hover: #5147D4;
      --bg: #070A12;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: #F8FAFC;
      font-family: 'Inter', -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #stage-container {
      position: relative;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 50px rgba(98, 88, 232, 0.2);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #1E293B;
      background: #080C16;
    }
    canvas {
      display: block;
      width: 960px;
      height: 540px;
    }
    #controls {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: #111827;
      padding: 10px 20px;
      border-radius: 9999px;
      border: 1px solid #1F2937;
      font-size: 14px;
      font-family: 'JetBrains Mono', monospace;
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 6px 16px;
      border-radius: 9999px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: background 0.15s;
    }
    button:hover { background: var(--primary-hover); }
    #scrubber {
      width: 320px;
      cursor: pointer;
      accent-color: var(--primary);
    }
  </style>
</head>
<body>

  <div id="stage-container">
    <canvas id="canvas" width="1920" height="1080"></canvas>
  </div>

  <div id="controls">
    <button id="playBtn">Play</button>
    <input type="range" id="scrubber" min="0" max="1199" value="0" step="1">
    <span id="timecode">00:00.00 / 00:40.00</span>
    <span id="sceneBadge" style="color:#A5B4FC; font-weight:600;">Scene 1</span>
  </div>

  <audio id="soundtrack" src="../output/soundtrack.wav" preload="auto"></audio>

  <script>
    // --- Canvas & Rendering State ---
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const playBtn = document.getElementById('playBtn');
    const scrubber = document.getElementById('scrubber');
    const timecode = document.getElementById('timecode');
    const sceneBadge = document.getElementById('sceneBadge');
    const audio = document.getElementById('soundtrack');

    const TOTAL_FRAMES = 1200;
    const FPS = 30;
    const DURATION = 40.0;
    let currentFrame = 0;
    let isPlaying = false;
    let lastTimestamp = 0;
    let animId = null;

    // Dimensions
    const params = new URLSearchParams(window.location.search);
    const CANVAS_WIDTH = parseInt(params.get('w') || '1920', 10);
    const CANVAS_HEIGHT = parseInt(params.get('h') || '1080', 10);
    canvas.width = CANVAS_WIDTH;
    canvas.height = CANVAS_HEIGHT;

    // Display scale in browser vs render mode
    if (params.get('render') === '1') {
      canvas.style.width = CANVAS_WIDTH + 'px';
      canvas.style.height = CANVAS_HEIGHT + 'px';
      const ctrl = document.getElementById('controls');
      if (ctrl) ctrl.style.display = 'none';
      const stage = document.getElementById('stage-container');
      if (stage) {
        stage.style.border = 'none';
        stage.style.boxShadow = 'none';
        stage.style.borderRadius = '0';
      }
      document.body.style.margin = '0';
      document.body.style.padding = '0';
      document.body.style.overflow = 'hidden';
    } else if (CANVAS_WIDTH === 1080 && CANVAS_HEIGHT === 1350) {
      canvas.style.width = '432px';
      canvas.style.height = '540px';
    } else {
      canvas.style.width = '960px';
      canvas.style.height = '540px';
    }

    // Load Logo Image
    const logoImg = new Image();
    let logoLoaded = false;
    logoImg.onload = () => { logoLoaded = true; renderFrame(currentFrame); };
    if (window.GRAMMORA_LOGO_B64) {
      logoImg.src = window.GRAMMORA_LOGO_B64;
    } else {
      logoImg.src = '../assets/Grammora-Logo.png';
    }

    // --- Math & Easing Helpers ---
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
    const easeInOutCubic = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const easeOutExpo = t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
    const easeOutBack = (t, s = 1.70158) => {
      const c1 = s;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    };

    // Rounded rectangle helper
    function roundRect(ctx, x, y, w, h, r) {
      if (w < 2 * r) r = w / 2;
      if (h < 2 * r) r = h / 2;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // Background Star / Grid Pattern
    function drawBackground(t) {
      const w = CANVAS_WIDTH;
      const h = CANVAS_HEIGHT;

      // Base gradient
      const bgGrad = ctx.createRadialGradient(w * 0.5, h * 0.45, 100, w * 0.5, h * 0.5, Math.max(w, h));
      bgGrad.addColorStop(0, '#111827');
      bgGrad.addColorStop(0.5, '#0B0F19');
      bgGrad.addColorStop(1, '#05070D');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      // Ambient glowing orbs
      const orb1X = w * 0.3 + Math.sin(t * 0.6) * 120;
      const orb1Y = h * 0.35 + Math.cos(t * 0.5) * 80;
      const grad1 = ctx.createRadialGradient(orb1X, orb1Y, 10, orb1X, orb1Y, 550);
      grad1.addColorStop(0, 'rgba(98, 88, 232, 0.28)');
      grad1.addColorStop(0.5, 'rgba(98, 88, 232, 0.08)');
      grad1.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad1;
      ctx.fillRect(0, 0, w, h);

      const orb2X = w * 0.75 + Math.cos(t * 0.4) * 100;
      const orb2Y = h * 0.65 + Math.sin(t * 0.7) * 90;
      const grad2 = ctx.createRadialGradient(orb2X, orb2Y, 10, orb2X, orb2Y, 600);
      grad2.addColorStop(0, 'rgba(56, 189, 248, 0.16)');
      grad2.addColorStop(0.5, 'rgba(99, 102, 241, 0.05)');
      grad2.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad2;
      ctx.fillRect(0, 0, w, h);

      // Tech Grid overlay
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      const gridSize = 64;
      for (let x = 0; x < w; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
      }
      for (let y = 0; y < h; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }
      ctx.restore();
    }

    // Realistic Mouse Cursor
    function drawCursor(x, y, clicking = false) {
      ctx.save();
      ctx.translate(x, y);

      if (clicking) {
        // Click ripple
        ctx.beginPath();
        ctx.arc(0, 0, 24, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(98, 88, 232, 0.7)';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.scale(0.88, 0.88);
      }

      // Cursor shadow
      ctx.shadowColor = 'rgba(0,0,0,0.45)';
      ctx.shadowBlur = 8;
      ctx.shadowOffsetY = 4;

      // Pointer path
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, 22);
      ctx.lineTo(5.5, 17.5);
      ctx.lineTo(11, 26);
      ctx.lineTo(14.5, 24);
      ctx.lineTo(9.5, 15.5);
      ctx.lineTo(17.5, 15.5);
      ctx.closePath();

      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = '#0F172A';
      ctx.stroke();

      ctx.restore();
    }

    // Realistic Chrome/Editor Mockup Window
    function drawEditorWindow(x, y, w, h, title = "Inbox — mail.google.com/mail/u/0/#inbox", activeTab = "New Message") {
      ctx.save();
      // Drop shadow
      ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
      ctx.shadowBlur = 40;
      ctx.shadowOffsetY = 24;

      // Card surface
      roundRect(ctx, x, y, w, h, 14);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      ctx.shadowColor = 'transparent';

      // Border
      ctx.strokeStyle = '#E2E8F0';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Title bar / browser chrome
      roundRect(ctx, x, y, w, 44, 14);
      ctx.fillStyle = '#F8FAFC';
      ctx.fill();
      ctx.fillRect(x, y + 25, w, 19); // Flatten bottom of title bar

      // Traffic light buttons
      const btnY = y + 22;
      const colors = ['#EF4444', '#F59E0B', '#10B981'];
      colors.forEach((col, idx) => {
        ctx.beginPath();
        ctx.arc(x + 24 + idx * 18, btnY, 5.5, 0, Math.PI * 2);
        ctx.fillStyle = col;
        ctx.fill();
      });

      // Browser Tab
      roundRect(ctx, x + 90, y + 8, 220, 36, 8);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      ctx.strokeStyle = '#E2E8F0';
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.font = '500 13px Inter, sans-serif';
      ctx.fillStyle = '#1E293B';
      ctx.fillText(activeTab, x + 110, y + 30);

      // Address pill
      roundRect(ctx, x + 330, y + 10, w - 360, 26, 6);
      ctx.fillStyle = '#EEF2F6';
      ctx.fill();

      // Lock icon + URL
      ctx.fillStyle = '#64748B';
      ctx.font = '12px "JetBrains Mono", monospace';
      ctx.fillText("🔒 https://" + title.split(" — ")[1], x + 348, y + 27);

      // Top action line
      ctx.beginPath();
      ctx.moveTo(x, y + 44);
      ctx.lineTo(x + w, y + 44);
      ctx.strokeStyle = '#E2E8F0';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Inner compose header
      ctx.font = '600 15px Inter, sans-serif';
      ctx.fillStyle = '#172033';
      ctx.fillText("To: hiring-team@innovate.tech", x + 36, y + 82);
      ctx.fillStyle = '#94A3B8';
      ctx.font = '500 14px Inter, sans-serif';
      ctx.fillText("Subject: Application & Inquiry", x + 36, y + 114);

      ctx.beginPath();
      ctx.moveTo(x + 36, y + 130);
      ctx.lineTo(x + w - 36, y + 130);
      ctx.strokeStyle = '#F1F5F9';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.restore();
    }

    // Grammora Floating Pen Pill (Real component representation)
    function drawFloatingPenPill(x, y, scale = 1.0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      ctx.shadowColor = 'rgba(98, 88, 232, 0.45)';
      ctx.shadowBlur = 16;
      ctx.shadowOffsetY = 6;

      roundRect(ctx, -18, -18, 36, 36, 10);
      ctx.fillStyle = '#6258E8';
      ctx.fill();
      ctx.shadowColor = 'transparent';

      // Pen nib icon
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 2.2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(-5, 6);
      ctx.lineTo(6, -5);
      ctx.moveTo(3, -8);
      ctx.lineTo(8, -3);
      ctx.moveTo(-7, 8);
      ctx.lineTo(-4, 8);
      ctx.stroke();

      ctx.restore();
    }

    // Grammora 5-Action Toolbar (Exact component representation)
    function drawToolbar(x, y, activeIndex = -1, scale = 1.0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      const items = [
        { label: "Fix Grammar", icon: "✨" },
        { label: "Rephrase", icon: "🔄" },
        { label: "Make Concise", icon: "✂️" },
        { label: "Change Tone", icon: "🎛️" },
        { label: "Insert", icon: "↵" }
      ];

      const w = 460;
      const h = 42;

      ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
      ctx.shadowBlur = 20;
      ctx.shadowOffsetY = 8;

      roundRect(ctx, 0, 0, w, h, 21);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      ctx.shadowColor = 'transparent';

      ctx.strokeStyle = '#E2E8F0';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      let curX = 12;
      items.forEach((item, idx) => {
        const itemW = 84;
        const isActive = (idx === activeIndex);

        if (isActive) {
          roundRect(ctx, curX, 5, itemW, 32, 16);
          ctx.fillStyle = '#6258E8';
          ctx.fill();
          ctx.fillStyle = '#FFFFFF';
        } else {
          ctx.fillStyle = '#475569';
        }

        ctx.font = '600 12px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(item.icon + " " + item.label.split(" ")[0], curX + itemW / 2, 25);
        curX += itemW + 4;
      });

      ctx.restore();
    }

    // Grammora Diff Preview Card with newly implemented [← Back] and [Apply]
    function drawDiffCard(x, y, featureTag, originalText, fixedText, highlightWord = "", progress = 1.0) {
      ctx.save();
      ctx.translate(x, y);

      const w = 440;
      const h = 186;

      ctx.shadowColor = 'rgba(15, 23, 42, 0.25)';
      ctx.shadowBlur = 24;
      ctx.shadowOffsetY = 12;

      roundRect(ctx, 0, 0, w, h, 14);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      ctx.shadowColor = 'transparent';

      ctx.strokeStyle = '#E2E8F0';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Card Header
      ctx.textAlign = 'left';

      // [← Back] Button
      roundRect(ctx, 14, 12, 64, 26, 6);
      ctx.fillStyle = '#F1F5F9';
      ctx.fill();
      ctx.font = '600 11px Inter, sans-serif';
      ctx.fillStyle = '#475569';
      ctx.fillText("← Back", 24, 29);

      // Feature Badge
      roundRect(ctx, 86, 12, 100, 26, 6);
      ctx.fillStyle = '#F0EEFF';
      ctx.fill();
      ctx.fillStyle = '#6258E8';
      ctx.font = '700 11px Inter, sans-serif';
      ctx.fillText(featureTag, 98, 29);

      // Close Esc badge
      ctx.fillStyle = '#94A3B8';
      ctx.font = '500 11px "JetBrains Mono", monospace';
      ctx.fillText("Esc to dismiss", w - 105, 29);

      // Divider
      ctx.beginPath();
      ctx.moveTo(14, 46);
      ctx.lineTo(w - 14, 46);
      ctx.strokeStyle = '#F1F5F9';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Original text preview
      ctx.font = '500 13px Inter, sans-serif';
      ctx.fillStyle = '#94A3B8';
      ctx.fillText(originalText, 16, 72);

      // Fixed / Generated text card
      roundRect(ctx, 14, 86, w - 28, 48, 8);
      ctx.fillStyle = '#F8FAFC';
      ctx.fill();
      ctx.strokeStyle = '#E2E8F0';
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.font = '600 14px Inter, sans-serif';
      ctx.fillStyle = '#0F172A';

      if (highlightWord && fixedText.includes(highlightWord)) {
        const parts = fixedText.split(highlightWord);
        ctx.fillText(parts[0], 24, 116);
        const p0Width = ctx.measureText(parts[0]).width;

        // Highlight tag for changed word
        const hwWidth = ctx.measureText(highlightWord).width;
        roundRect(ctx, 22 + p0Width, 98, hwWidth + 8, 24, 4);
        ctx.fillStyle = 'rgba(16, 185, 129, 0.15)';
        ctx.fill();

        ctx.fillStyle = '#10B981';
        ctx.fillText(highlightWord, 26 + p0Width, 116);

        ctx.fillStyle = '#0F172A';
        ctx.fillText(parts[1], 34 + p0Width + hwWidth, 116);
      } else {
        ctx.fillText(fixedText, 24, 116);
      }

      // Actions bottom bar
      // Discard Button
      roundRect(ctx, 14, 144, 76, 30, 6);
      ctx.fillStyle = '#F1F5F9';
      ctx.fill();
      ctx.fillStyle = '#64748B';
      ctx.font = '600 12px Inter, sans-serif';
      ctx.fillText("Discard", 28, 164);

      // Apply Button
      roundRect(ctx, w - 110, 144, 96, 30, 6);
      ctx.fillStyle = '#6258E8';
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '600 12px Inter, sans-serif';
      ctx.fillText("✓ Apply", w - 88, 164);

      ctx.restore();
    }

    // --- MAIN RENDER FUNCTION: window.renderFrame(frameIndex, totalFrames) ---
    window.renderFrame = function(frameIdx = 0, total = TOTAL_FRAMES) {
      currentFrame = clamp(frameIdx, 0, TOTAL_FRAMES - 1);
      const t = currentFrame / FPS; // Time in seconds 0.00 to 40.00

      // Update HUD
      scrubber.value = currentFrame;
      const mins = Math.floor(t / 60).toString().padStart(2, '0');
      const secs = (t % 60).toFixed(2).padStart(5, '0');
      timecode.textContent = `${mins}:${secs} / 00:40.00`;

      // Clear & Draw dynamic background
      drawBackground(t);

      // Determine active scene
      let sceneNum = 1;
      if (t < 3.0) sceneNum = 1;
      else if (t < 6.0) sceneNum = 2;
      else if (t < 11.0) sceneNum = 3;
      else if (t < 16.0) sceneNum = 4;
      else if (t < 21.0) sceneNum = 5;
      else if (t < 26.0) sceneNum = 6;
      else if (t < 31.0) sceneNum = 7;
      else if (t < 35.0) sceneNum = 8;
      else sceneNum = 9;

      sceneBadge.textContent = `Scene ${sceneNum}`;

      // Render Active Scene
      ctx.save();
      switch (sceneNum) {
        case 1: renderScene1(t); break;
        case 2: renderScene2(t); break;
        case 3: renderScene3(t); break;
        case 4: renderScene4(t); break;
        case 5: renderScene5(t); break;
        case 6: renderScene6(t); break;
        case 7: renderScene7(t); break;
        case 8: renderScene8(t); break;
        case 9: renderScene9(t); break;
      }
      ctx.restore();
    };

    // ==========================================
    // SCENE 1: The Hook (0.00s – 3.00s)
    // "Writing shouldn't slow you down."
    // Kinetic Typography + Hesitant Typing Friction
    // ==========================================
    function renderScene1(t) {
      const p = t / 3.0; // 0 to 1
      const cx = CANVAS_WIDTH / 2;
      const cy = CANVAS_HEIGHT / 2;

      // Camera slight push-in
      const scale = 1.0 + p * 0.05;
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      ctx.translate(-cx, -cy);

      // Headline Kinetic Type
      const headline = "Writing shouldn't slow you down.";
      const words = headline.split(" ");

      ctx.textAlign = 'center';
      ctx.font = '800 68px "Inter Tight", Inter, sans-serif';

      words.forEach((word, idx) => {
        const wordDelay = idx * 0.14;
        const wp = clamp((t - wordDelay) / 0.45, 0, 1);
        const ease = easeOutBack(wp);
        const yOffset = (1 - ease) * 40;
        const opacity = wp;

        ctx.save();
        ctx.fillStyle = (idx === 2) ? '#818CF8' : `rgba(248, 250, 252, ${opacity})`;
        ctx.shadowColor = (idx === 2) ? 'rgba(98, 88, 232, 0.6)' : 'transparent';
        ctx.shadowBlur = 24;

        // Position words in a single strong line or 2 lines
        const lineY = cy - 40;
        const wordX = cx - 440 + idx * 195;

        ctx.translate(wordX, lineY + yOffset);
        ctx.fillText(word, 0, 0);
        ctx.restore();
      });

      // Simulated friction typing box
      const boxW = 760;
      const boxH = 90;
      const boxX = cx - boxW / 2;
      const boxY = cy + 40;

      roundRect(ctx, boxX, boxY, boxW, boxH, 16);
      ctx.fillStyle = 'rgba(19, 27, 46, 0.85)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(98, 88, 232, 0.3)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Simulated typing with backspace hesitation
      let text = "";
      if (t < 0.8) text = "";
      else if (t < 1.1) text = "I am writ";
      else if (t < 1.4) text = "I am writting to askk...";
      else if (t < 1.8) text = "I am writting to";
      else if (t < 2.4) text = "I am wr";
      else text = "";

      ctx.textAlign = 'left';
      ctx.font = '500 24px Inter, sans-serif';
      ctx.fillStyle = '#CBD5E1';
      ctx.fillText(text, boxX + 32, boxY + 54);

      // Blinking cursor
      const textWidth = ctx.measureText(text).width;
      if (Math.floor(t * 4) % 2 === 0) {
        ctx.fillStyle = '#818CF8';
        ctx.fillRect(boxX + 34 + textWidth, boxY + 30, 3, 30);
      }
    }

    // ==========================================
    // SCENE 2: Introducing Grammora (3.00s – 6.00s)
    // Big reveal of authentic Grammora Logo (Grammora-Logo.png)
    // ==========================================
    function renderScene2(t) {
      const p = (t - 3.0) / 3.0; // 0 to 1
      const cx = CANVAS_WIDTH / 2;
      const cy = CANVAS_HEIGHT / 2;

      // Reveal ease
      const scaleEase = easeOutBack(clamp(p / 0.65, 0, 1), 1.2);
      const alpha = clamp(p / 0.3, 0, 1);

      // Ambient radial energy rings
      ctx.save();
      const ringScale = 1.0 + p * 0.4;
      ctx.beginPath();
      ctx.arc(cx, cy - 60, 160 * ringScale, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(98, 88, 232, ${0.4 * (1 - p)})`;
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(cx, cy - 60, 220 * ringScale, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(56, 189, 248, ${0.25 * (1 - p)})`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();

      // Draw real Grammora Logo PNG
      if (logoLoaded && logoImg.width > 0) {
        ctx.save();
        ctx.translate(cx, cy - 60);
        ctx.scale(scaleEase, scaleEase);

        // Logo ambient glow
        ctx.shadowColor = 'rgba(98, 88, 232, 0.7)';

      if (p >= 0.52) {

          ctx.fillStyle = '#94A3B8';

          // [Tab ⇥] key pill
          const pillX = textX + typedW + 36;

          ctx.save();
          ctx.translate(pillX + 35, pillY + 13);
          ctx.scale(pulse, pulse);
          ctx.translate(-(pillX + 35), -(pillY + 13));

          roundRect(ctx, pillX, pillY, 70, 26, 6);
          ctx.fillStyle = '#6258E8';
          ctx.fill();
          ctx.fillStyle = '#FFFFFF';
          ctx.font = '700 12px "JetBrains Mono", monospace';

    // --- Interactive Playback Engine ---
    function loop(timestamp) {
      if (!isPlaying) return;
      if (!lastTimestamp) lastTimestamp = timestamp;
      const delta = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      currentFrame += delta * FPS;
      if (currentFrame >= TOTAL_FRAMES) {
        currentFrame = TOTAL_FRAMES - 1;
        isPlaying = false;
        playBtn.textContent = 'Play';
        audio.pause();
        audio.currentTime = 0;
      }

      renderFrame(Math.floor(currentFrame));
      if (isPlaying) {
        animId = requestAnimationFrame(loop);
      }
    }

    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        if (currentFrame >= TOTAL_FRAMES - 1) currentFrame = 0;
        playBtn.textContent = 'Pause';
        lastTimestamp = performance.now();
        audio.currentTime = currentFrame / FPS;
        audio.play().catch(() => {});
        animId = requestAnimationFrame(loop);
      } else {
        playBtn.textContent = 'Play';
        audio.pause();
        if (animId) cancelAnimationFrame(animId);
      }
    });

    scrubber.addEventListener('input', (e) => {
      currentFrame = parseInt(e.target.value, 10);
      if (audio) audio.currentTime = currentFrame / FPS;
      renderFrame(currentFrame);
    });

    // Initial render
    renderFrame(0);
  </script>
</body>
</html>
